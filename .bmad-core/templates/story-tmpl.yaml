# <!-- Powered by BMAD™ Core -->
template:
  id: use-case-template-v1-1
  name: Use Case Specification
  version: '1.1'
  output:
    format: markdown
    filename: docs/use-cases/{{use_case_id}}.{{use_case_title_short}}.md
    title: 'Use Case {{use_case_id}}: {{use_case_title_short}}'
workflow:
  mode: interactive
  elicitation: advanced-elicitation
agent_config:
  editable_sections:
    - use-case-overview
    - main-flow
    - alternative-exception-scenarios
    - business-rules
    - screens
    - fields-validations
    - buttons
    - notifications
    - nfrs
    - ux-flows
    - wireframes-mockups
    - accessibility
    - error-empty-states
    - responsive-behavior
    - content-microcopy
    - design-system-mapping
    - security-controls
    - authn-authz
    - data-classification-privacy
    - threat-modeling
    - owasp-requirements
    - audit-logging-monitoring
    - compliance
    - traceability
    - auto-traceability-config
    - tasks-subtasks
    - dev-notes
    - change-log
    - dev-agent-record
    - qa-results
  # Optional: simple computed links for auto-traceability (BRD & Story links)
  automation:
    computed_links:
      brd_objectives:
        base_url: "{{brd_base_url}}"
        ids: "{{brd_objective_ids}}"   # e.g., ["OBJ-001","OBJ-002"]
      stories:
        base_url: "{{stories_base_url}}"
        ids: "{{story_ids}}"           # e.g., ["EP-12.ST-03","EP-12.ST-07"]
      apis:
        base_url: "{{api_docs_base_url}}"
        ids: "{{api_names}}"           # e.g., ["CandidateAPI","AuthAPI"]
sections:
  - id: use-case-overview
    title: Use Case Overview
    instruction: High-level details per SURE-BRD Use Case template.
    owner: ba-agent
    editors: [ba-agent, product-owner]
    sections:
      - id: meta
        title: Metadata
        type: table
        columns: [Field, Details]
        rows:
          - [Use Case ID, '{{use_case_id}}']
          - [Use Case, '{{use_case_title}}']
          - [Trigger, '']
          - [Purpose, '']
          - [Business Value / Goal Alignment, 'Reference BRD objective IDs, e.g., OBJ-001, OBJ-002']
          - [Users / Actors, 'List of roles / personas']
          - [Preconditions, 'List preconditions']
          - [Post Conditions, 'List post conditions']
    sections_append:
      - id: scope
        title: Scope
        type: bulleted-list
        instruction: In-scope vs out-of-scope notes.
  - id: main-flow
    title: Main Success Scenario
    type: numbered-list
    instruction: Primary success path steps for the use case.
    elicit: true
    owner: ba-agent
    editors: [ba-agent]
  - id: alternative-exception-scenarios
    title: Alternative & Exception Scenarios
    type: table
    columns: [ID, Type, Description, Steps]
    rows:
      - [AS-001, Alternative, 'Describe the scenario', '1) ... 2) ...']
      - [EX-001, Exception, 'Describe the exception', '1) ... 2) ...']
    instruction: Capture alternative paths and exceptions with step lists.
    owner: ba-agent
    editors: [ba-agent, product-owner]
  - id: business-rules
    title: Business Rules
    type: table
    columns: [Rule ID, Rule Description, Applies To (Field/Location), Source / Justification]
    rows:
      - [BR-001, '...', '...', 'e.g., Legal mandate']
    instruction: List business rules (not field validation).
    owner: ba-agent
    editors: [ba-agent, product-owner]
  - id: screens
    title: Screens
    instruction: Per screen: description, actions, accessibility level, mockups.
    owner: ux-agent
    editors: [ux-agent, ba-agent]
    sections:
      - id: screen-record
        title: Screen
        type: table
        columns: [Field, Details]
        rows:
          - [Screen, '{{screen_name}}']
          - [Description, 'Business purpose and logic.']
          - [Main User Actions, 'List actions.']
          - [Accessibility (WCAG) Level, 'A/AA/AAA']
          - [Screenshot/Mockup, "<html>\n<!-- grayscale mockup HTML here -->\n</html>"]
  - id: fields-validations
    title: Fields and Validations
    type: table
    columns: [Screen, Field Name, Field Type, Field Validation, Read Only, Mandatory]
    rows:
      - [Screen Name, Field Name, Text, 'Max length 100; Allowed values: ...', 'No', 'Yes']
    instruction: Field-level validations by screen.
    owner: ba-agent
    editors: [ba-agent, ux-agent]
  - id: buttons
    title: Buttons
    type: table
    columns: [Screen, Name, Condition, Action]
    rows:
      - [Screen Name, Button Name, 'Conditions related to the button', 'Resulting action']
    owner: ba-agent
    editors: [ba-agent, ux-agent]
  - id: notifications
    title: Notifications
    type: table
    columns: [Notification ID, Trigger, Content Summary, Channel, Frequency/Timing]
    rows:
      - [NF-001, Event trigger, Short message summary, 'Email / In-App', Immediate]
    owner: ba-agent
    editors: [ba-agent, product-owner]
  - id: nfrs
    title: Non-Functional Requirements
    type: table
    columns: [NFR ID, Category, Requirement Description, Metric / Acceptance Criteria]
    rows:
      - [NFR-001, Performance, 'Page load time should be minimal.', '< 3s on 5Mbps connection']
    owner: ba-agent
    editors: [ba-agent, qa-agent, security-officer]

  # --- UX TABS (new) ---
  - id: ux-flows
    title: UX Flows
    type: bulleted-list
    instruction: Describe end-to-end flows (e.g., Create, Edit, Approve). Link to diagrams.
    owner: ux-agent
    editors: [ux-agent, ba-agent]
  - id: accessibility
    title: Accessibility (WCAG 2.2)
    type: table
    columns: [Area, Guideline, Requirement, Acceptance Criteria]
    rows:
      - [Forms, 'Labels & Instructions', 'All inputs have programmatic labels', 'NVDA reads labels correctly']
    owner: ux-agent
    editors: [ux-agent, qa-agent]
  - id: error-empty-states
    title: Error & Empty States
    type: bulleted-list
    instruction: Enumerate error/empty states and recovery guidance.
    owner: ux-agent
    editors: [ux-agent, ba-agent]
  - id: responsive-behavior
    title: Responsive Behavior
    type: table
    columns: [Breakpoint, Layout Notes, Exceptions]
    rows:
      - ['≥1440px', 'Desktop layout', '']
      - ['≥1024px', 'Laptop layout', '']
      - ['≥768px', 'Tablet layout', '']
      - ['<768px', 'Mobile layout', '']
    owner: ux-agent
    editors: [ux-agent]
  - id: content-microcopy
    title: Content Design / Microcopy
    type: bulleted-list
    instruction: Key microcopy, tone, and localization considerations.
    owner: ux-agent
    editors: [ux-agent, ba-agent]
  - id: design-system-mapping
    title: Design System Mapping
    type: table
    columns: [UI Element, Token/Component, Notes]
    rows:
      - [Primary Button, 'ds.button.primary', '']
      - [Text Input, 'ds.input.text', ''] 
    owner: ux-agent
    editors: [ux-agent, dev-agent]

  # --- SECURITY CONTROLS (new) ---
  - id: security-controls
    title: Security Controls
    type: section
    instruction: Consolidated security requirements aligned with OWASP ASVS / NIST controls.
    owner: security-officer
    editors: [security-officer, dev-agent, qa-agent]
    sections:
      - id: authn-authz
        title: Authentication & Authorization
        type: table
        columns: [Item, Requirement, Acceptance Criteria]
        rows:
          - [Authentication, 'MFA for privileged roles', 'Role {role} login requires MFA']
          - [Authorization, 'RBAC with least privilege', 'Role-permission matrix enforced in API']
      - id: data-classification-privacy
        title: Data Classification & Privacy
        type: table
        columns: [Data Element, Classification, Handling / Masking, Retention]
        rows:
          - [National ID, 'Confidential', 'Mask at UI, encrypt at rest', '5 years or per policy']
      - id: threat-modeling
        title: Threat Modeling (STRIDE summary)
        type: bulleted-list
        instruction: Briefly identify threats and mitigations.
      - id: owasp-requirements
        title: OWASP ASVS Requirements
        type: table
        columns: [ASVS Control, Description, Evidence/Link]
        rows:
          - ['V2.1', 'Authenticated session management', '']
      - id: audit-logging-monitoring
        title: Audit Logging & Monitoring
        type: table
        columns: [Event, Level, Destination, Retention]
        rows:
          - [Login Failure, Warning, 'SIEM/Log Server', '90 days']
      - id: compliance
        title: Compliance Mapping
        type: table
        columns: [Standard/Policy, Control/Clause, Implementation, Evidence]
        rows:
          - ['NCA ECC / ISO 27001', 'A.9 Access Control', 'RBAC + JIT access', '']

 
  - id: tasks-subtasks
    title: Tasks / Subtasks
    type: bullet-list
    instruction: |
      Break down the use case into specific tasks and subtasks needed for implementation.
      Reference applicable Business rules, acceptance criteria, and Fields validation numbers where relevant.
      Any field validation must be referenced to the fields-validations table.
      Field length must be refrenced in tasks and subtasks.
    template: |
      - [ ] Task 1 (AC: # if applicable)
        - [ ] Subtask1.1...
      - [ ] Task 2 (AC: # if applicable)
        - [ ] Subtask 2.1...
      - [ ] Task 3 (AC: # if applicable)
        - [ ] Subtask 3.1...
    elicit: true
    owner: scrum-master
    editors: [scrum-master, dev-agent]
    
  - id: dev-notes
    title: Dev Notes
    instruction: |
      Populate relevant information, only what was pulled from actual artifacts from docs folder, relevant to this story:
      - Do not invent information
      - If known add Relevant Source Tree info that relates to this story
      - If there were important notes from previous story that are relevant to this one, include them here
      - Put enough information in this section so that the dev agent should NEVER need to read the architecture documents, these notes along with the tasks and subtasks must give the Dev Agent the complete context it needs to comprehend with the least amount of overhead the information to complete the story, meeting all AC and completing all tasks+subtasks
    elicit: true
    owner: scrum-master
    editors: [scrum-master]
    sections:
      - id: testing-standards
        title: Testing
        instruction: |
          List Relevant Testing Standards from Architecture the Developer needs to conform to:
          - Test file location
          - Test standards
          - Testing frameworks and patterns to use
          - Any specific testing requirements for this story
        elicit: true
        owner: scrum-master
        editors: [scrum-master]
        
  - id: change-log
    title: Change Log
    type: table
    columns: [Date, Version, Description, Author]
    instruction: Track changes made to this story document
    owner: scrum-master
    editors: [scrum-master, dev-agent, qa-agent]
    
  - id: dev-agent-record
    title: Dev Agent Record
    instruction: This section is populated by the development agent during implementation
    owner: dev-agent
    editors: [dev-agent]
    sections:
      - id: agent-model
        title: Agent Model Used
        template: "{{agent_model_name_version}}"
        instruction: Record the specific AI agent model and version used for development
        owner: dev-agent
        editors: [dev-agent]
        
      - id: debug-log-references
        title: Debug Log References
        instruction: Reference any debug logs or traces generated during development
        owner: dev-agent
        editors: [dev-agent]
        
      - id: completion-notes
        title: Completion Notes List
        instruction: Notes about the completion of tasks and any issues encountered
        owner: dev-agent
        editors: [dev-agent]
        
      - id: file-list
        title: File List
        instruction: List all files created, modified, or affected during story implementation
        owner: dev-agent
        editors: [dev-agent]
        
  - id: qa-results
    title: QA Results
    instruction: Results from QA Agent QA review of the completed story implementation
    owner: qa-agent
    editors: [qa-agent]

    title: Approvals
    type: table
    columns: [Role, Name, Signature, Date]
    rows:
      - [Product Owner, '', '', '']
      - [BA, '', '', '']
      - [UX, '', '', '']
      - [QA, '', '', '']
      - [Tech Lead, '', '', '']
    owner: product-owner
    editors: [product-owner, ba-agent]