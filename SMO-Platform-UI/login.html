<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/png" href="images/favicons/favicon-96x96.png" sizes="96x96">
    <link rel="icon" type="image/svg+xml" href="images/favicons/favicon.svg">
    <link rel="shortcut icon" href="images/favicons/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="images/favicons/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-title" content="SMO">
    <link rel="manifest" href="images/favicons/site.webmanifest">

    <link rel="stylesheet" href="css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/swiper-bundle.min.css">
    <link rel="stylesheet" href="css/nice-select2.css">
    <link rel="stylesheet" href="css/fancybox.css">
    <link rel="stylesheet" href="css/aos.css">
    <link rel="stylesheet" href="css/styles.min.css">
    <title>تسجيل الدخول - مكتب الإدارة الاستراتيجية</title>
    <!--[if lt IE 9]>
        <script src="js/html5shiv.min.js"></script>
        <script src="js/respond.min.js"></script>
    <![endif]-->
</head>

<body class="overflow-hidden">
    <main class="login-page">
        <div class="container">
            <div class="row">
                <div class="col-12 mb-5">
                    <a href="index.html" class="login-page__logo">
                        <img src="images/logo.svg" alt="مكتب الإدارة الاستراتيجية">
                    </a>
                </div>
            </div>
            <div class="row">
                <div class="col-12 mb-5">
                    <div class="login-card">
                        <img class="login-card__logo" src="images/nic-logo.svg" alt="">
                        <div class="login-card__details">
                            <h2 class="login-card__title">النفاذ الوطني الموحد</h2>
                            <p class="login-card__description">يمكنك الدخول عن طريق منصة النفاذ الوطني الموحد بالضغط على زر تسجيل الدخول</p>
                        </div>
                        <div class="login-card__actions">
                            <a href="" class="btn btn-lg btn-primary" id="nafathLogin">
                                <img class="btn-icon" src="images/arrow-right-white-icon.svg" alt="">
                                <span>تسجيل الدخول عبر نفاذ</span>
                            </a>
                            <!-- Development Bypass Button -->
                            <button class="btn btn-lg btn-warning mt-3" id="devBypass" onclick="bypassLogin()">
                                <i class="bi bi-bug-fill"></i>
                                <span>دخول وضع التطوير (Development Mode)</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-12 d-flex justify-content-center">
                    <span class="copyrights">&copy; <span class="copyrights__year">2025</span> جميع الحقوق محفوظة - مكتب الإدارة الاستراتيجية</span>
                </div>
            </div>
        </div>
    </main>
    <div class="page-preloader">
        <div class="loading-bar">
            <div class="loading-line"></div>
            <div class="loading-line"></div>
        </div>
        <div class="loading-message">
            <div class="loading-spinner"></div>
            <div class="loading-logo">
                <img src="images/logo-icon.svg" alt="">
            </div>
        </div>
    </div>
    <script src="js/popper.min.js"></script>
    <script src="js/bootstrap.min.js"></script>
    <script src="js/swiper-bundle.min.js"></script>
    <script src="js/nice-select2.js"></script>
    <script src="js/fancybox.umd.js"></script>
    <script src="js/ar.umd.js"></script>
    <script src="js/aos.js"></script>
    <script src="js/api-service.js"></script>
    <script src="js/scripts.js"></script>
    <script>
        // Show development bypass button if on localhost
        document.addEventListener('DOMContentLoaded', function() {
            if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
                const devButton = document.getElementById('devBypass');
                if (devButton) {
                    devButton.style.display = 'block';
                }
            }
        });

        // Bypass login for development
        function bypassLogin() {
            console.log('Bypassing login for development mode...');
            
            // Set dummy tokens
            localStorage.setItem('access_token', 'dev-bypass-token');
            localStorage.setItem('refresh_token', 'dev-refresh-token');
            localStorage.setItem('user', JSON.stringify({
                id: 1,
                username: 'dev-user',
                fullName: 'مستخدم تطوير',
                roles: ['SMO', 'PerformanceManager', 'VRO', 'ExecutiveOffice', 'VRP']
            }));
            
            // Show success message
            alert('تم تفعيل وضع التطوير - Development mode activated');
            
            // Check if user has multiple roles
            const user = JSON.parse(localStorage.getItem('user'));
            if (user.roles && user.roles.length > 1) {
                // Redirect to profile selection if multiple roles
                window.location.href = 'profile-selection.html';
            } else if (user.roles && user.roles.length === 1) {
                // Set the single role as current
                localStorage.setItem('currentRole', user.roles[0]);
                window.location.href = 'index.html';
            } else {
                // Default redirect
                window.location.href = 'index.html';
            }
        }

        // Handle Nafath login (placeholder)
        document.getElementById('nafathLogin').addEventListener('click', function(e) {
            e.preventDefault();
            alert('النفاذ الوطني الموحد غير متاح في وضع التطوير\nNafath is not available in development mode\n\nاستخدم زر "دخول وضع التطوير" بدلاً من ذلك');
        });
    </script>
</body>

</html>
