<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Connection Test</title>
    <link rel="stylesheet" href="css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <style>
        body {
            padding: 2rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            max-width: 800px;
            background: white;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
        }
        .status-connecting { background: #ffc107; animation: pulse 1s infinite; }
        .status-success { background: #28a745; }
        .status-error { background: #dc3545; }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        .endpoint-test {
            padding: 1rem;
            margin: 0.5rem 0;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            transition: all 0.3s ease;
        }
        .endpoint-test:hover {
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        pre {
            background: #f8f9fa;
            padding: 1rem;
            border-radius: 5px;
            max-height: 300px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="mb-4">
            <i class="bi bi-plugin"></i> اختبار اتصال API
        </h1>
        
        <div class="alert alert-info mb-4">
            <strong>معلومات الاتصال:</strong>
            <ul class="mt-2 mb-0">
                <li>الخادم المحلي: <code id="localUrl">https://localhost:7001/api</code></li>
                <li>الموقع الحالي: <code id="currentHost"></code></li>
                <li>وضع التطوير: <code id="devMode"></code></li>
            </ul>
        </div>

        <div class="mb-4">
            <h3>الإعدادات</h3>
            <div class="mb-3">
                <label class="form-label">عنوان API المخصص (اختياري):</label>
                <input type="text" class="form-control" id="customApiUrl" placeholder="http://your-api-server:port/api">
                <small class="text-muted">اتركه فارغاً لاستخدام الإعدادات الافتراضية</small>
            </div>
            <button class="btn btn-primary" onclick="testAllEndpoints()">
                <i class="bi bi-play-circle"></i> اختبار جميع النقاط
            </button>
        </div>

        <h3>نتائج الاختبار</h3>
        <div id="testResults"></div>

        <div class="mt-4">
            <h3>السجل</h3>
            <pre id="logOutput"></pre>
        </div>
    </div>

    <script src="js/jquery-3.7.1.min.js"></script>
    <script src="js/bootstrap.min.js"></script>
    <script src="js/api-service.js"></script>
    <script>
        // Display current configuration
        document.getElementById('currentHost').textContent = window.location.hostname;
        document.getElementById('devMode').textContent = window.location.hostname === 'localhost' ? 'نعم' : 'لا';
        
        // Log function
        function log(message, type = 'info') {
            const logOutput = document.getElementById('logOutput');
            const timestamp = new Date().toLocaleTimeString('ar-SA');
            const color = type === 'error' ? '#dc3545' : type === 'success' ? '#28a745' : '#333';
            logOutput.innerHTML += `<span style="color: ${color}">[${timestamp}] ${message}</span>\n`;
            logOutput.scrollTop = logOutput.scrollHeight;
        }

        // Test single endpoint
        async function testEndpoint(name, url, method = 'GET') {
            const resultDiv = document.createElement('div');
            resultDiv.className = 'endpoint-test';
            resultDiv.innerHTML = `
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <strong>${name}</strong><br>
                        <small class="text-muted">${url}</small>
                    </div>
                    <div>
                        <span class="status-indicator status-connecting"></span>
                        <span class="status-text">جاري الاختبار...</span>
                    </div>
                </div>
                <div class="mt-2 response-details"></div>
            `;
            
            document.getElementById('testResults').appendChild(resultDiv);
            
            try {
                log(`Testing ${name}: ${url}`, 'info');
                
                // Use custom URL if provided
                const customUrl = document.getElementById('customApiUrl').value;
                const baseUrl = customUrl || API_CONFIG.BASE_URL;
                const fullUrl = url.startsWith('http') ? url : baseUrl + url;
                
                const startTime = Date.now();
                const response = await fetch(fullUrl, {
                    method: method,
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${TokenManager.getToken()}`
                    },
                    // Allow self-signed certificates in development
                    ...(window.location.hostname === 'localhost' && {
                        mode: 'cors',
                        credentials: 'omit'
                    })
                });
                
                const responseTime = Date.now() - startTime;
                
                if (response.ok || response.status === 401) { // 401 is expected without proper auth
                    const statusIndicator = resultDiv.querySelector('.status-indicator');
                    const statusText = resultDiv.querySelector('.status-text');
                    const responseDetails = resultDiv.querySelector('.response-details');
                    
                    statusIndicator.className = 'status-indicator status-success';
                    statusText.innerHTML = `<span class="text-success">متصل (${response.status}) - ${responseTime}ms</span>`;
                    
                    const data = await response.text();
                    responseDetails.innerHTML = `
                        <small class="text-muted">
                            Status: ${response.status} ${response.statusText}<br>
                            Response Time: ${responseTime}ms<br>
                            ${data ? `Preview: ${data.substring(0, 100)}...` : 'No data'}
                        </small>
                    `;
                    
                    log(`✓ ${name} responded with ${response.status} in ${responseTime}ms`, 'success');
                } else {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
            } catch (error) {
                const statusIndicator = resultDiv.querySelector('.status-indicator');
                const statusText = resultDiv.querySelector('.status-text');
                const responseDetails = resultDiv.querySelector('.response-details');
                
                statusIndicator.className = 'status-indicator status-error';
                statusText.innerHTML = `<span class="text-danger">فشل الاتصال</span>`;
                responseDetails.innerHTML = `<small class="text-danger">${error.message}</small>`;
                
                log(`✗ ${name} failed: ${error.message}`, 'error');
            }
        }

        // Test all endpoints
        async function testAllEndpoints() {
            document.getElementById('testResults').innerHTML = '';
            document.getElementById('logOutput').innerHTML = '';
            
            log('بدء اختبار الاتصال...', 'info');
            
            // Test main endpoints
            const endpoints = [
                { name: 'MEI Indicators', url: API_CONFIG.ENDPOINTS.MACROECONOMIC },
                { name: 'Vision Data', url: API_CONFIG.ENDPOINTS.VISION },
                { name: 'Performance Dashboard', url: API_CONFIG.ENDPOINTS.PERFORMANCE_DASHBOARD },
                { name: 'Programs', url: API_CONFIG.ENDPOINTS.PROGRAMS },
                { name: 'Initiatives', url: API_CONFIG.ENDPOINTS.INITIATIVES },
                { name: 'Thresholds', url: API_CONFIG.ENDPOINTS.THRESHOLDS }
            ];
            
            for (const endpoint of endpoints) {
                await testEndpoint(endpoint.name, endpoint.url);
                await new Promise(resolve => setTimeout(resolve, 500)); // Small delay between tests
            }
            
            log('اكتمل الاختبار!', 'success');
        }

        // Auto-test on load if localhost
        if (window.location.hostname === 'localhost') {
            setTimeout(() => {
                log('Running automatic test for localhost...', 'info');
                testAllEndpoints();
            }, 1000);
        }
    </script>
</body>
</html>
