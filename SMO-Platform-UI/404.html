<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - الصفحة غير موجودة</title>
    
    <link rel="icon" type="image/png" href="images/favicons/favicon-96x96.png" sizes="96x96">
    <link rel="icon" type="image/svg+xml" href="images/favicons/favicon.svg">
    <link rel="shortcut icon" href="images/favicons/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="images/favicons/apple-touch-icon.png">
    
    <link rel="stylesheet" href="css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/styles.min.css">
    
    <style>
        .error-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            position: relative;
            overflow: hidden;
        }
        
        .error-page::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 320"><path fill="%23ffffff" fill-opacity="0.1" d="M0,96L48,112C96,128,192,160,288,165.3C384,171,480,149,576,128C672,107,768,85,864,96C960,107,1056,149,1152,149.3C1248,149,1344,107,1392,85.3L1440,64L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path></svg>') no-repeat bottom;
            background-size: cover;
        }
        
        .error-content {
            text-align: center;
            color: white;
            z-index: 1;
            padding: 20px;
            animation: fadeInUp 0.8s ease;
        }
        
        .error-code {
            font-size: 150px;
            font-weight: bold;
            margin-bottom: 20px;
            text-shadow: 4px 4px 8px rgba(0,0,0,0.3);
            animation: pulse 2s infinite;
        }
        
        .error-message {
            font-size: 28px;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        
        .error-description {
            font-size: 18px;
            margin-bottom: 40px;
            opacity: 0.9;
        }
        
        .error-icon {
            font-size: 100px;
            margin-bottom: 30px;
            animation: float 3s ease-in-out infinite;
        }
        
        .error-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .btn-error {
            padding: 12px 30px;
            font-size: 16px;
            border-radius: 50px;
            transition: all 0.3s;
        }
        
        .btn-error:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }
        
        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-20px);
            }
        }
        
        .search-box {
            max-width: 500px;
            margin: 0 auto 30px;
        }
        
        .search-box .input-group {
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            border-radius: 50px;
            overflow: hidden;
        }
        
        .search-box input {
            border: none;
            padding: 15px 20px;
        }
        
        .search-box button {
            border: none;
            padding: 15px 25px;
        }
        
        .quick-links {
            margin-top: 50px;
            padding-top: 30px;
            border-top: 1px solid rgba(255,255,255,0.3);
        }
        
        .quick-links h4 {
            margin-bottom: 20px;
            opacity: 0.9;
        }
        
        .quick-links a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            opacity: 0.8;
            transition: opacity 0.3s;
        }
        
        .quick-links a:hover {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="error-page">
        <div class="error-content">
            <div class="error-icon">
                <i class="bi bi-emoji-frown"></i>
            </div>
            
            <div class="error-code">404</div>
            
            <div class="error-message">
                عذراً، الصفحة المطلوبة غير موجودة
            </div>
            
            <div class="error-description">
                يبدو أن الصفحة التي تبحث عنها قد تم نقلها أو حذفها أو أنها لم تكن موجودة من الأساس
            </div>
            
            <div class="search-box">
                <div class="input-group">
                    <input type="text" class="form-control" placeholder="ابحث عما تريد..." id="searchInput">
                    <button class="btn btn-light" type="button" onclick="performSearch()">
                        <i class="bi bi-search"></i> بحث
                    </button>
                </div>
            </div>
            
            <div class="error-buttons">
                <a href="index.html" class="btn btn-light btn-error">
                    <i class="bi bi-house-door"></i> الصفحة الرئيسية
                </a>
                <button class="btn btn-outline-light btn-error" onclick="goBack()">
                    <i class="bi bi-arrow-right"></i> الصفحة السابقة
                </button>
                <a href="performance-dashboard.html" class="btn btn-outline-light btn-error">
                    <i class="bi bi-speedometer2"></i> لوحة المعلومات
                </a>
            </div>
            
            <div class="quick-links">
                <h4>روابط سريعة قد تفيدك:</h4>
                <div>
                    <a href="performance-programs.html">
                        <i class="bi bi-collection"></i> البرامج
                    </a>
                    <a href="performance-initiatives.html">
                        <i class="bi bi-diagram-3"></i> المبادرات
                    </a>
                    <a href="report-generation.html">
                        <i class="bi bi-file-earmark-text"></i> التقارير
                    </a>
                    <a href="settings.html">
                        <i class="bi bi-gear"></i> الإعدادات
                    </a>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        function goBack() {
            if (window.history.length > 1) {
                window.history.back();
            } else {
                window.location.href = 'index.html';
            }
        }
        
        function performSearch() {
            const query = document.getElementById('searchInput').value;
            if (query.trim()) {
                // In production, this would search and redirect
                // For now, redirect to main page with search query
                window.location.href = 'index.html?search=' + encodeURIComponent(query);
            }
        }
        
        // Allow Enter key to search
        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                performSearch();
            }
        });
        
        // Log 404 error for analytics (if implemented)
        if (window.apiService) {
            window.apiService.log404Error(window.location.pathname);
        }
    </script>
    <!-- Role Manager Integration -->
    <script src="assets/js/apply-role-manager.js"></script>

</body>
</html>
